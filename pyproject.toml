[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "isort>=5.12.0",
    "requests>=2.34.2",
    "llm-sdk",
    "accelerate>=0.20.0",
]

[tool.uv.workspace]
members = ["llm_sdk"] 

[tool.uv.sources]
llm-sdk = { workspace = true }

[tool.mypy]
exclude = ["llm_sdk/"]

[tool.uv]
link-mode = "symlink"

warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.20.2",
]